<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mina Rafla - Personal Website and CV">
    <title>Mina Rafla - Homepage</title>
    <link rel="stylesheet" href="styles.css">

    <!-- KaTeX for math rendering in TIL previews -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <!-- Header loaded dynamically -->
    <div id="header-placeholder"></div>

    <!-- Fixed Left Sidebar Navigation -->
    <aside class="cv-sidebar" id="cv-sidebar">
        <nav class="cv-nav" id="cv-nav">
            <a href="#recent-posts" class="cv-nav-link">Posts</a>
            <a href="#latest-tils" class="cv-nav-link">TILs</a>
            <a href="#work-experience" class="cv-nav-link">Experience</a>
            <a href="#education" class="cv-nav-link">Education</a>
            <a href="#highlights" class="cv-nav-link">Highlights</a>
            <a href="#publications" class="cv-nav-link">Publications</a>
            <a href="blog.html" class="cv-nav-link cv-nav-link-external">All Posts</a>
        </nav>
    </aside>
    
    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
    </button>
    
    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobile-overlay"></div>

    <!-- Main Content -->
    <main id="main-content" class="main-content main-content-with-sidebar">
        <div class="container">
            
            <!-- Recent Posts Preview Section -->
            <section class="section" id="recent-posts">
                <h2 class="section-title">Recent Posts</h2>
                <div class="blog-preview-list" id="blog-preview-list">
                    <!-- Generated automatically -->
                </div>
                <div class="blog-preview-footer">
                    <a href="blog.html" class="blog-view-all-link">View all posts →</a>
                </div>
            </section>

            <!-- Latest TILs Preview Section -->
            <section class="section" id="latest-tils">
                <h2 class="section-title">Latest TILs</h2>
                <div class="blog-preview-list" id="tils-preview-list">
                    <!-- Generated automatically -->
                </div>
                <div class="blog-preview-footer">
                    <a href="tils.html" class="blog-view-all-link">View all TILs →</a>
                </div>
            </section>

            <!-- Work Experience and Education - Side by Side -->
            <div class="sections-row">
                <!-- Work Experience Section - Generated from cv-data.js -->
                <section class="section section-half" id="work-experience">
                    <h2 class="section-title">Work Experience</h2>
                    <div class="timeline" id="work-experience-list">
                        <!-- Generated automatically -->
                    </div>
                </section>

                <!-- Education Section - Generated from cv-data.js -->
                <section class="section section-half" id="education">
                    <h2 class="section-title">Education</h2>
                    <div class="timeline" id="education-list">
                        <!-- Generated automatically -->
                    </div>
                </section>
            </div>

            <!-- Highlights Section - Generated from cv-data.js -->
            <section class="section" id="highlights">
                <h2 class="section-title">Highlights</h2>
                <div class="awards-list" id="highlights-list">
                    <!-- Generated automatically -->
                </div>
            </section>

            <!-- Publications Section - Generated from cv-data.js -->
            <section class="section" id="publications">
                <h2 class="section-title">Publications</h2>
                <div class="publications-list" id="publications-list">
                    <!-- Generated automatically -->
                </div>
            </section>

        </div>
    </main>

    <!-- Footer loaded dynamically -->
    <div id="footer-placeholder"></div>

    <script src="data/cv-data.js"></script>
    <script src="data/blog-data.js"></script>
    <script src="data/tils-data.js"></script>
    <script src="js/script.js"></script>

    <!-- Render math in TIL previews (runs after script.js injects them) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                });
            }
        });
    </script>
</body>
</html>
